- name: Exercise the HANA NFS cluster resources against a file-backed CIB
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    flavor: classic
  tasks:
    - name: Present the cluster node as RHEL 9
      fake_platform:
        os_family: RedHat
        distribution: RedHat
        version: "9.4"
    - name: HANA resources with file systems on Azure NetApp Files
      ansible.builtin.include_role:
        name: azure.sap_automation.ha_pacemaker_ra_hana_scaleup
      vars:
        ha_pacemaker_nodes:
          - {name: n1, address: 10.0.0.1}
          - {name: n2, address: 10.0.0.2}
        ha_pacemaker_config_node: "{{ ansible_facts['hostname'] }}"
        ha_pacemaker_ra_hana_scaleup_sid: X00
        ha_pacemaker_ra_hana_scaleup_instance_number: "00"
        ha_pacemaker_ra_hana_scaleup_virtual_ip: 10.0.0.9
        ha_pacemaker_ra_hana_scaleup_flavor: "{{ flavor }}"
        ha_pacemaker_ra_hana_scaleup_nfs: true
        ha_pacemaker_ra_hana_scaleup_nfs_mounts:
          - node: n1
            data: 10.0.2.4:/x00-data-1/hanadata
            log: 10.0.2.4:/x00-log-1/hanalog
            shared: 10.0.2.4:/x00-shared-1/hanashared
          - node: n2
            data: 10.0.2.4:/x00-data-2/hanadata
            log: 10.0.2.4:/x00-log-2/hanalog
            shared: 10.0.2.4:/x00-shared-2/hanashared
