###########################################################################################
# This file calls the OS specific tasks to configure HANA specific clustering resources  #8
###########################################################################################


# Clustering commands are based on the Host OS
# Opt-in: with use_sap_automation_collection the cluster resources are applied
# by the azure.sap_automation collection for the scenarios it covers. The NFS
# mount monitoring resources and the active/read-enabled secondary virtual IP
# are only implemented by the legacy tasks.
- name:                                "5.5.4 HANA Pacemaker - Determine the implementation to use"
  ansible.builtin.set_fact:
    hana_resources_use_collection: >-
                                       {{ use_sap_automation_collection | default(false) | bool
                                          and not (database_active_active | default(false) | bool)
                                          and NFS_provider | default('NONE') != 'ANF'
                                          and not (ansible_os_family | upper == 'REDHAT'
                                                   and ansible_distribution_major_version | int < 8) }}

- name:                                "5.5.4 HANA Pacemaker - Cluster Preparation ({{ ansible_os_family }})"
  ansible.builtin.include_tasks:
    file:                              "5.5.4.0-clusterPrep-{{ ansible_os_family }}.yml"
    apply:
      become:                          true
      become_user:                     root
      tags:
        - "5.5.4.0-cluster-prep"
  when:                                not hana_cluster_existence_check

- name:                                "5.5.4 HANA Pacemaker - Cluster Configuration ({{ ansible_os_family }})"
  ansible.builtin.include_tasks:
    file:                              "5.5.4.1-cluster-{{ ansible_os_family }}.yml"
    apply:
      become:                          true
      become_user:                     root
      tags:
        - "5.5.4.1-cluster"
  when:
    - not hana_cluster_existence_check
    - not hana_resources_use_collection

- name:                                "5.5.4 HANA Pacemaker - Cluster Configuration (azure.sap_automation collection)"
  ansible.builtin.include_tasks:
    file:                              "5.5.4.2-cluster-collection.yml"
    apply:
      become:                          true
      become_user:                     root
      tags:
        - "5.5.4.1-cluster"
  when:
    - not hana_cluster_existence_check
    - hana_resources_use_collection
