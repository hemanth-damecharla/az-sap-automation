###########################################################################################
# This file calls the OS specific tasks to configure DB2 specific clustering resources  #8
###########################################################################################


# Clustering commands are based on the Host OS
# Opt-in: with use_sap_automation_collection the cluster resources are applied
# by the azure.sap_automation collection on RHEL 8 or later and SLES 15 or
# later. Stopping Db2 and changing the instance owner's shell stay in
# 5.7.3.0-cluster-*.yml.
- name:                                "5.7.3 DB2 Pacemaker - Determine the implementation of the cluster resources"
  ansible.builtin.set_fact:
    db2_resources_use_collection: >-
                                       {{ use_sap_automation_collection | default(false) | bool
                                          and ansible_distribution_major_version | int >= (8 if ansible_os_family | upper == 'REDHAT' else 15) }}

- name:                                "5.7.3 DB2 Pacemaker - Cluster based on OS in VM"
  ansible.builtin.include_tasks:       "5.7.3.0-cluster-{{ ansible_os_family }}.yml"

- name:                                "5.7.3 DB2 Pacemaker - Cluster resources (azure.sap_automation collection)"
  ansible.builtin.include_role:
    name:                              azure.sap_automation.ha_pacemaker_ra_db2
  vars:
    ha_pacemaker_ra_db2_nodes:           "{{ ansible_play_hosts_all | map('community.general.dict_kv', 'name') | list }}"
    ha_pacemaker_ra_db2_config_node:     "{{ primary_instance_name }}"
    ha_pacemaker_ra_db2_sid:             "{{ db_sid | upper }}"
    ha_pacemaker_ra_db2_instance_number: "{{ db_instance_number }}"
    ha_pacemaker_ra_db2_virtual_ip:      "{{ database_loadbalancer_ip }}"
  when:                                db2_resources_use_collection | bool

...
