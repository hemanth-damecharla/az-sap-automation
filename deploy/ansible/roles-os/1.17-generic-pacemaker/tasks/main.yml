---
# /*---------------------------------------------------------------------------8
# |                                                                            |
# | Opt-in: with use_sap_automation_collection the cluster is built by the     |
# | azure.sap_automation collection for the scenarios it covers. Every other   |
# | scenario, and the default, continues to use the tasks in 1.17-legacy.yml.  |
# |                                                                            |
# +------------------------------------4--------------------------------------*/
- name:                                     "1.17 Generic Pacemaker - Determine the implementation to use"
  ansible.builtin.set_fact:
    pacemaker_use_collection: >-
                                            {{ use_sap_automation_collection | default(false) | bool
                                               and node_tier == 'hana'
                                               and not (database_scale_out | default(false) | bool)
                                               and database_cluster_type == 'AFA'
                                               and not (ansible_os_family | upper == 'REDHAT'
                                                        and ansible_distribution_major_version | int < 8)
                                               and (ansible_distribution | lower ~ ansible_distribution_version) != 'sles_sap12.4' }}

- name:                                     "1.17 Generic Pacemaker - Legacy implementation"
  ansible.builtin.import_tasks:             1.17-legacy.yml
  when:                                     not pacemaker_use_collection

- name:                                     "1.17 Generic Pacemaker - azure.sap_automation collection"
  ansible.builtin.include_tasks:            1.17.9-collection.yml
  when:                                     pacemaker_use_collection

...
# /*---------------------------------------------------------------------------8
# |                                   END                                      |
# +------------------------------------4--------------------------------------*/
