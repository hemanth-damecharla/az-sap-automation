---
- name: Load platform variables
  ansible.builtin.import_tasks: set_vars.yml

- name: Configure the cluster resources
  ansible.builtin.import_tasks: resources.yml
  when: __ha_pacemaker_ra_hana_scaleup_is_config_node | bool

- name: Order Pacemaker after the SAP HANA instance service
  ansible.builtin.import_tasks: systemd.yml
  when: __ha_pacemaker_ra_hana_scaleup_service_dropin | bool
