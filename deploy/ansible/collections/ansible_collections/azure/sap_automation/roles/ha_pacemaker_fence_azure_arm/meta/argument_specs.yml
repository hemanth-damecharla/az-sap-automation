---
argument_specs:
  main:
    short_description: Azure fence agent STONITH
    description:
      - Creates the C(fence_azure_arm) STONITH resource and enables fencing.
      - The agent authenticates with the managed identity of the cluster VMs,
        or with a service principal. With a managed identity no credential is
        stored in the cluster configuration; with a service principal the
        secret is, as for any fence agent password.
    options:
      ha_pacemaker_fence_azure_arm_authentication:
        description: How the fence agent authenticates to Azure.
        type: str
        choices: [msi, spn]
        default: msi
      ha_pacemaker_fence_azure_arm_tenant_id:
        description: Microsoft Entra tenant ID of the service principal. Required with V(spn).
        type: str
      ha_pacemaker_fence_azure_arm_client_id:
        description: Application (client) ID of the service principal. Required with V(spn).
        type: str
      ha_pacemaker_fence_azure_arm_client_secret:
        description: Client secret of the service principal. Required with V(spn).
        type: str
        no_log: true
      ha_pacemaker_fence_azure_arm_nodes:
        description: Cluster nodes. Defaults to C(ha_pacemaker_nodes).
        type: list
        elements: dict
        required: true
        options:
          name:
            description: Short host name of the node as known to the cluster.
            type: str
            required: true
          vm_name:
            description: Azure virtual machine name of the node.
            type: str
            required: true
          address:
            description: IP address of the node. Not used by this role.
            type: str
      ha_pacemaker_fence_azure_arm_config_node:
        description: Node on which the cluster configuration is applied.
        type: str
        required: true
      ha_pacemaker_fence_azure_arm_subscription_id:
        description: Azure subscription ID of the cluster VMs.
        type: str
        required: true
      ha_pacemaker_fence_azure_arm_resource_group:
        description: Azure resource group of the cluster VMs.
        type: str
        required: true
      ha_pacemaker_fence_azure_arm_cloud:
        description: Azure cloud of the cluster VMs.
        type: str
        choices: [public, usgov]
        default: public
      ha_pacemaker_fence_azure_arm_resource_id:
        description: ID of the STONITH resource.
        type: str
        default: rsc_st_azure
      ha_pacemaker_fence_azure_arm_stonith_timeout:
        description: Value of the C(stonith-timeout) cluster property, in seconds.
        type: str
        default: "900"
      ha_pacemaker_fence_azure_arm_priority_fencing_delay:
        description:
          - Value of the C(priority-fencing-delay) cluster property.
          - Defaults to V(15) on RHEL and is left unset on SLES, where the resource agent roles set it.
        type: str
      ha_pacemaker_fence_azure_arm_parameters:
        description: Extra C(fence_azure_arm) parameters merged over the platform defaults.
        type: dict
        default: {}
