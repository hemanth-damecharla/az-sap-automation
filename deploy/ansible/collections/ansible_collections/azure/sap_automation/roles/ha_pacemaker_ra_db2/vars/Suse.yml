---
# Microsoft Learn, "High availability of IBM Db2 LUW on Azure VMs on SUSE
# Linux Enterprise Server with Pacemaker", section "Pacemaker configuration".
__ha_pacemaker_ra_db2_platform:
  db2:
    id: "rsc_Db2_{{ __ha_pacemaker_ra_db2_suffix }}"
    meta: {}
    clone_id: "msl_Db2_{{ __ha_pacemaker_ra_db2_suffix }}"
    clone_meta: {promotable: "true", target-role: Started, notify: "true"}
  ip:
    id: "rsc_ip_{{ __ha_pacemaker_ra_db2_suffix }}"
    operations:
      - {name: monitor, interval: 10s, timeout: 20s}
  nc:
    id: "rsc_nc_{{ __ha_pacemaker_ra_db2_suffix }}"
    operations:
      - {name: monitor, interval: "10", timeout: 20s}
  group_id: "g_ip_{{ __ha_pacemaker_ra_db2_suffix }}"
  colocation_id: "col_db2_{{ __ha_pacemaker_ra_db2_suffix }}"
  colocation_rsc_role: Started
  order_id: "ord_db2_ip_{{ __ha_pacemaker_ra_db2_suffix }}"
  rsc_defaults: {resource-stickiness: "1000", migration-threshold: "5000"}
  priority_fencing_delay: ""
