---
- name: Bootstrap the cluster
  ansible.builtin.include_role:
    name: "{{ ha_pacemaker_core_role }}"

- name: Configure fencing
  ansible.builtin.include_role:
    name: "{{ __ha_pacemaker_fence_role }}"
  loop: "{{ ha_pacemaker_fence_roles }}"
  loop_control:
    loop_var: __ha_pacemaker_fence_role

- name: Configure cluster resources
  ansible.builtin.include_role:
    name: "{{ __ha_pacemaker_ra_role }}"
  loop: "{{ ha_pacemaker_ra_roles }}"
  loop_control:
    loop_var: __ha_pacemaker_ra_role
