---
- name: Load platform variables
  ansible.builtin.import_tasks: set_vars.yml

- name: Check the inputs
  ansible.builtin.assert:
    that:
      - __ha_pacemaker_ra_hana_scaleout_mm in ha_pacemaker_ra_hana_scaleout_nodes | map(attribute='name')
      - not __ha_pacemaker_ra_hana_scaleout_spec['topology_nfs_rule']
        or (ha_pacemaker_ra_hana_scaleout_shared_devices | length == 2
            and ha_pacemaker_ra_hana_scaleout_site1_nodes | length > 0
            and ha_pacemaker_ra_hana_scaleout_site2_nodes | length > 0)
    fail_msg: >-
      The majority maker must be one of ha_pacemaker_ra_hana_scaleout_nodes. With
      the classic agents on RHEL, set the /hana/shared device and the nodes of
      both sites.
    quiet: true

# The check resource bind-mounts a directory of /hana/shared on every HANA
# node.
- name: Create the directories of the file system check
  ansible.builtin.file:
    path: "{{ __ha_pacemaker_ra_hana_scaleout_check_dir }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ __ha_pacemaker_ra_hana_scaleout_spec['fscheck']['device'] }}"
    - "{{ __ha_pacemaker_ra_hana_scaleout_spec['fscheck']['directory'] }}"
  loop_control:
    loop_var: __ha_pacemaker_ra_hana_scaleout_check_dir
  when:
    - __ha_pacemaker_ra_hana_scaleout_spec['fscheck'] | length > 0
    - ansible_facts['hostname'] != __ha_pacemaker_ra_hana_scaleout_mm

- name: Configure the cluster resources
  ansible.builtin.import_tasks: resources.yml
  when: __ha_pacemaker_ra_hana_scaleout_is_config_node | bool
