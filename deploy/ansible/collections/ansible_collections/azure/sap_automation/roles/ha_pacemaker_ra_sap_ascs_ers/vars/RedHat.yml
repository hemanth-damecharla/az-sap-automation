---
# Microsoft Learn, "High availability for SAP NetWeaver on Azure VMs on Red Hat
# Enterprise Linux with Azure NetApp Files for SAP applications".
# pcs adds a monitor operation from the agent's defaults when it creates a
# resource; a CIB written directly has none, and Pacemaker would never check
# the resource. The values are those the Azure guides give where they state
# them.
__ha_pacemaker_ra_sap_ascs_ers_platform:
  members: [fs, vip, nc]
  fs_parameters: {force_unmount: safe, fast_stop: "no"}
  fs_operations:
    - {name: start, interval: "0", timeout: "60"}
    - {name: stop, interval: "0", timeout: "120"}
    - {name: monitor, interval: "200", timeout: "{{ ha_pacemaker_ra_sap_ascs_ers_fs_monitor_timeout }}"}
  vip_operations:
    - {name: monitor, interval: 10s, timeout: 20s}
  nc_operations:
    - {name: monitor, interval: "10", timeout: 20s}
  sap_operations:
    - {name: monitor, interval: "20", timeout: "{{ ha_pacemaker_ra_sap_ascs_ers_sap_monitor_timeout }}", on-fail: restart}
    - {name: start, interval: "0", timeout: "600"}
    - {name: stop, interval: "0", timeout: "600"}
  # Classic layout: the cluster mounts the instance directories.
  startsrv: false
  sap_prefix: rsc_sap_
  sap_profile_parameters: true
  minimal_probe: false
  failover_on: sap
  order_on: group
  # Priorities and priority-fencing-delay need pacemaker 2.0.4-6.el8 or later.
  rsc_defaults: >-
    {{ {'resource-stickiness': '1', 'migration-threshold': '3'}
       | combine({'priority': '1'} if __ha_pacemaker_ra_sap_ascs_ers_priority_fencing | bool else {}) }}
  enqueue:
    ensa1:
      ascs_meta: >-
        {{ {'resource-stickiness': '5000', 'migration-threshold': '1', 'failure-timeout': '60'}
           | combine({'priority': '10'} if __ha_pacemaker_ra_sap_ascs_ers_priority_fencing | bool else {}) }}
      ers_meta: {}
      failover_location: true
      priority_fencing_delay: "{{ '15s' if __ha_pacemaker_ra_sap_ascs_ers_priority_fencing | bool else '' }}"
    ensa2:
      ascs_meta: >-
        {{ {'resource-stickiness': '5000'}
           | combine({'priority': '10'} if __ha_pacemaker_ra_sap_ascs_ers_priority_fencing | bool else {}) }}
      ers_meta: {}
      failover_location: false
      priority_fencing_delay: "{{ '15s' if __ha_pacemaker_ra_sap_ascs_ers_priority_fencing | bool else '' }}"

__ha_pacemaker_ra_sap_ascs_ers_priority_fencing: >-
  {{ (ansible_facts['packages']['pacemaker'] | default([{'version': '0'}]))[0]['version'] is version('2.0.4', '>=') }}

# Microsoft Learn, "High-availability SAP NetWeaver with simple mount and NFS
# on RHEL for SAP Virtual Machines" (RHEL 9 and later).
__ha_pacemaker_ra_sap_ascs_ers_simple_mount_platform:
  members: [vip, nc]
  startsrv: true
  startsrv_prefix: rsc_SAPStartSrv_
  startsrv_provider: heartbeat
  # The guide disables the monitor of SAPStartSrv explicitly.
  startsrv_operations:
    - {name: monitor, interval: "0", timeout: "20", enabled: "0"}
  sap_prefix: rsc_SAPInstance_
  sap_profile_parameters: false
  minimal_probe: true
  sap_operations:
    - {name: monitor, interval: "20", timeout: "{{ ha_pacemaker_ra_sap_ascs_ers_sap_monitor_timeout }}", on-fail: restart}
  ers_operations:
    - {name: monitor, interval: "20", timeout: "{{ ha_pacemaker_ra_sap_ascs_ers_sap_monitor_timeout }}", on-fail: restart}
    - {name: start, interval: "0", timeout: "600"}
    - {name: stop, interval: "0", timeout: "600"}
  failover_on: group
  rsc_defaults: {resource-stickiness: "1", migration-threshold: "3"}
  enqueue:
    ensa1:
      ascs_meta: {resource-stickiness: "5000", priority: "100", migration-threshold: "1"}
      ers_meta: {}
      priority_fencing_delay: "15"
    ensa2:
      ascs_meta: {resource-stickiness: "5000", priority: "100"}
      ers_meta: {}
      priority_fencing_delay: "15"
