---
# /*---------------------------------------------------------------------------8
# |                                                                            |
# | Opt-in: with use_sap_automation_collection, system replication for a      |
# | scale-up system is configured by the azure.sap_automation collection.     |
# | Every other scenario, and the default, continues to use the tasks in      |
# | 4.0.1-legacy.yml.                                                          |
# |                                                                            |
# +------------------------------------4--------------------------------------*/
- name:                                "HANA HSR: - Determine the implementation to use"
  ansible.builtin.set_fact:
    hsr_use_collection: >-
                                       {{ use_sap_automation_collection | default(false) | bool
                                          and not (database_scale_out | default(false) | bool) }}

- name:                                "HANA HSR: - Legacy implementation"
  ansible.builtin.import_tasks:        4.0.1-legacy.yml
  when:                                not hsr_use_collection

- name:                                "HANA HSR: - azure.sap_automation collection"
  ansible.builtin.include_tasks:       4.0.1.9-collection.yml
  when:                                hsr_use_collection

...
